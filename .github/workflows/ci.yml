name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run check

      - name: Build (web + extension)
        run: bun run build

      - name: Package .vsix
        run: bun run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaghetti-canvas-vsix
          path: "*.vsix"
          retention-days: 30
